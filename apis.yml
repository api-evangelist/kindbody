description: >-
  Kindbody is a national fertility and family-building clinic network and
  employer benefit provider. Services include IVF, egg freezing, embryo
  banking, male fertility care, LGBTQ+ family building, oncofertility,
  gestational surrogacy, and egg donation, plus a wellness layer
  (Kindbody360) and lab testing (Kindlabs). Kindbody operates a
  direct-to-employer fertility benefit and partners with payers; clinical
  workflows are exposed through a Patient Portal, an online scheduling system,
  and a Referring Provider Portal. No public developer or partner API has been
  identified - integration appears to be handled through gated employer and
  payer onboarding. This entry catalogs the company surface for the API
  Evangelist index.
